Advisory when the safe reading is one the author wrote; Action required when the safe form is one nobody wrote. A portion marked both NOFORN and REL TO resolves to NOFORN and offers the REL TO back as an Advisory. The JOINT fallback is a form nobody wrote, so it is a fallback, not a reading; the question stays Action required when a person is there.
"""
