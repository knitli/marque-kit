schema = 1
id = "MD-0025"
title = "Public, dual-licensed, and under the `@knitli` scope"
status = "active"
decided_at = 2026-11-04
recorded_at = 2026-11-04
authority = "direct"
decision = """
Public, dual-licensed, and under the `@knitli` scope. The kit ships as `@knitli/marque-kit` dual-licensed AGPL-3.0-only or commercial (LICENSE.md); trademark is separate (TRADEMARK.md); code contributions require the CLA (CONTRIBUTING.md, CLA.md). The root workspace and Office add-in app stay private. Supersedes the Marque Commercial License placeholder.
"""
rationale = "AGPL-3.0-only keeps the kit open; the commercial option covers hosts that need it."
rejected = []
examples = []

[scope]
areas = ["kit.licensing"]
paths = [
  "LICENSE.md",
  "LICENSES/**",
  "CLA.md",
  "CONTRIBUTING.md",
  "TRADEMARK.md",
  "REUSE.toml",
  "packages/*/LICENSE.txt",
]
rule_ids = []
profiles = ["all"]
applies_when = "Licensing, the package scope or contribution terms change."
excludes = []

