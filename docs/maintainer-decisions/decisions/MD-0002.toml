schema = 1
id = "MD-0002"
title = "Gold means a person must act; blue means a person can"
status = "active"
decided_at = 2026-10-13
recorded_at = 2026-10-21
authority = "direct"
decision = """
Gold means a person must act; blue means a person can. Action required and Blocking are gold; Advisory is a blue dotted underline on the marking; Noticeable a thin neutral underline; Quiet has no mark.
"""
rationale = "Two colors, two meanings, nothing else. The engine's `most_restrictive` ranking is the Advisory rung's data: \"safe reading taken, intent unknown.\""
rejected = []
examples = []

