title = "Knitli's design system guides the kit"
status = "active"
decided_at = 2026-10-13
recorded_at = 2026-10-21
authority = "direct"
decision = """
Knitli's design system guides the kit. The Marque system is a lineage, not a source; nothing from it is carried over as-is.
"""
rationale = "Its gold-as-accent, saturated red, lifting cards and typed arrows contradict decisions Knitli has since made."
