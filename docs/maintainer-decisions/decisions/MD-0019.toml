decision = """
The kit is its own repo and package (`@knitli/marque-kit`), plain CSS and ES modules, no framework (superseded by MD-0020 and MD-0022). It depends on Knitli's token values, not its component bundle.
"""
rationale = "Hosts are Word, Outlook and the web; the kit has to drop into all three."
