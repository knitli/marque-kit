areas = ["kit.testing"]
paths = ["packages/kit/vite.config.ts", "packages/kit/package.json", "packages/kit/test/dom/**"]
rule_ids = []
profiles = ["all"]
applies_when = "DOM behavior is tested."
excludes = []

