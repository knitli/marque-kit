schema = 1
id = "MD-0021"
title = "The DOM is tested under happy-dom"
status = "active"
decided_at = 2026-10-24
recorded_at = 2026-10-24
authority = "direct"
decision = """
The DOM is tested under happy-dom. `vp test` (the Vitest Vite+ bundles) runs `test/dom/` with `happy-dom` as a dev dependency; the other tests stay plain node. Nothing ships with it: no runtime dependency, no second build step.
"""
rationale = "`render.ts` is where most decided rules reach a person (question first, the free answer and \"Not my call\", no Undo on a fix the person must own, overrides shown, gold only on must-act); untested, a refactor could drop one with CI green."
rejected = []
examples = []

