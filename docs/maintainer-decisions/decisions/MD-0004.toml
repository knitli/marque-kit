schema = 1
id = "MD-0004"
title = "Two layers of state"
status = "active"
decided_at = 2026-10-13
recorded_at = 2026-10-21
authority = "direct"
decision = """
Two layers of state. Identified and generated are Marque's; applied, completed, deferred and seen are the host's; ready is Marque's again, at finalize. Generated is never shown as applied.
"""
rationale = "The engine resolves; the host actuates."
