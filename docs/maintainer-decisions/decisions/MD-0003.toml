schema = 1
id = "MD-0003"
title = "Attention is derived, never emitted"
status = "active"
decided_at = 2026-10-13
recorded_at = 2026-10-21
authority = "direct"
decision = """
Attention is derived, never emitted. Marque emits `needs_person` and `blocks`; the host supplies the moment; the kit computes the rung. Severity never sets a rung.
"""
rationale = "Severity is about the rule; attention is about the person and the moment."
rejected = []
examples = []

