recorded_at = 2026-10-21
authority = "direct"
decision = """
No Undo on a fix the person must own; an override is recorded. "Keep as written" is offered on Noticeable and Advisory; the audit reports the finding as-is either way. Amended 25 Oct: the person's own answer can always be taken back (MD-0023); on Action required that restores the text as written and asks the question again. What has no Undo is Marque's fix.
"""
rationale = "Suppressing a finding is a decision; the audit always reports it."
