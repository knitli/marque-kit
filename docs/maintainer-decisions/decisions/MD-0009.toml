schema = 1
id = "MD-0009"
title = "Help in three tiers"
status = "active"
decided_at = 2026-10-14
recorded_at = 2026-10-21
authority = "direct"
decision = """
Help in three tiers. Tier 1 the authored `plain` text; tier 2 the verbatim `short` quote with a citation chip; tier 3 the section itself, landing on the quoted sentence, in a window, not a modal. Authored and verbatim stay visually distinct everywhere the manual's words appear.
"""
rationale = "A reader must always know whether Marque or the manual is speaking."
rejected = []
examples = []

[scope]
areas = ["kit.help"]
paths = ["packages/kit/src/help.ts", "docs/COMPONENTS.md", "fixtures/memo.vocab.json", "fixtures/memo.manual.json"]
rule_ids = []
profiles = ["all"]
applies_when = "Help text or citations are shown."
excludes = []

