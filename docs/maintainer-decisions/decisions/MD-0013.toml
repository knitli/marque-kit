schema = 1
id = "MD-0013"
title = "Caller edits are the caller's call; Marque offers a conservative fallback"
status = "active"
decided_at = 2026-10-16
recorded_at = 2026-10-21
authority = "direct"
decision = """
Caller edits are the caller's call; Marque offers a conservative fallback. When the host can't perform an edit the recommendation is to block, but it's an integration decision. When Marque can't fully resolve but understands enough, it computes the most restrictive form that keeps every stated equity — for the JOINT case `(S//FGI AUS GBR//NF)`. The kit shows that fallback on the Blocking card as what happens if nobody answers.
"""
rationale = "An unattended deployment with nobody to ask needn't be babysat."
rejected = []
examples = []

