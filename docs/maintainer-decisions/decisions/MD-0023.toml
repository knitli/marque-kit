schema = 1
id = "MD-0023"
title = "An act leaves Undo in its card's place for 8 seconds"
status = "active"
decided_at = 2026-10-25
recorded_at = 2026-10-25
authority = "direct"
decision = """
An act leaves Undo in its card's place for 8 seconds. After any act but a take-back, the card's place says what was done, with the new marking, and offers Undo; hovering or focusing it stops the clock, leaving restarts it with what was left. Undo is a take-back (`changed`, null): the text goes back and, on Action required, the question comes back. Focus moves to Undo if it was in the pane, and the live region says it's there. One at a time; the next act replaces it.
"""
rationale = "The card leaving at once reads as \"nothing happened\"; Word's own undo isn't obvious to everyone and the pane can't see it until the cursor moves."
rejected = []
examples = []

[scope]
areas = ["kit.state", "kit.pane"]
paths = ["packages/kit/src/render.ts"]
