version = 1

# Files that can't carry a header: JSON has no comments, lockfiles are generated,
# and memo.txt is the document every span in the fixtures is a byte offset into.
[[annotations]]
path = ["**/package.json", "pnpm-lock.yaml", "mise.lock", "fixtures/memo.txt", "fixtures/*.json"]
SPDX-FileCopyrightText = "2026 Knitli Inc."
SPDX-License-Identifier = "AGPL-3.0-only"

# Verbatim AGPL text shipped in each published package so the tarball carries its license.
[[annotations]]
path = ["packages/*/LICENSE.txt"]
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc. <https://fsf.org/>"
SPDX-License-Identifier = "AGPL-3.0-only"
