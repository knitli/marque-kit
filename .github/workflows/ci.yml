name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A PR's new push cancels its stale run; each push to main keeps its own.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    name: Check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs vp (version from the vite-plus catalog entry), Node and pnpm, then `vp install`.
      # pnpm/action-setup isn't on the org's allowed-actions list; this is.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 26
          cache: true

      - name: Format, lint, typecheck
        run: vp run check

      - name: Test
        run: vp run test

      - name: Build
        run: vp run build

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned, as in marque-dev: a PyPI release can't change what passes.
      - name: Install reuse
        run: pipx install "reuse[charset-normalizer]==6.2.0"

      - name: reuse lint
        run: reuse lint
