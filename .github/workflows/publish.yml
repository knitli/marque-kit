name: Publish

# Publishes @knitli/marque-kit-core and @knitli/marque-kit to npm and cuts a
# signed GitHub release. The adapter packages (web/word/outlook) are
# placeholders with no build yet; add them to the filters below and to
# RELEASING.md when they ship a dist/.
#
# npm trusted publishing is bound to this file's name (publish.yml), this
# repo, and the `npm-publish` environment. Changing any of the three breaks
# publishing until the trusted publisher is updated on npmjs.com.
# See RELEASING.md for the one-time setup.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and attest only; do not publish to npm or release'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check, test, build, pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Sigstore keyless signing for the build attestation
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 26
          cache: true

      - name: Format, lint, typecheck
        run: vp run check

      - name: Test
        run: vp run test

      - name: Build
        run: vp run build

      # Core and kit version in lockstep; a release tag must match both.
      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version="$(node -p "require('./packages/kit/package.json').version")"
          core="$(node -p "require('./packages/core/package.json').version")"
          if [ "$version" != "$core" ]; then
            echo "::error::packages/kit ($version) and packages/core ($core) are not versioned in lockstep."
            exit 1
          fi
          publish="false"
          if [ "$EVENT_NAME" = "push" ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::Tag $REF_NAME does not match package version $version."
              exit 1
            fi
            publish="true"
          elif [ "$DRY_RUN" != "true" ]; then
            publish="true"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Version $version; publish=$publish"

      # pnpm pack, not npm pack: pnpm normalizes the workspace:* dependency
      # to the real version in the packed manifest. These exact tarballs are
      # attested, published to npm, and attached to the GitHub release.
      - name: Pack tarballs
        run: |
          mkdir -p release-assets
          pnpm --filter @knitli/marque-kit-core pack --pack-destination release-assets
          pnpm --filter @knitli/marque-kit pack --pack-destination release-assets
          ls -l release-assets

      # Sigstore-backed GitHub attestation over the exact tarballs npm receives.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release-assets/*.tgz'

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm, sign, release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Trusted publishing exchanges this job's OIDC token with npm; no
    # NPM_TOKEN secret exists or may be added. The environment's protection
    # rules (required reviewers) are the human gate on a real publish.
    environment: npm-publish
    permissions:
      contents: write # GitHub release
      id-token: write # npm trusted publishing, npm provenance, Sigstore keyless signing
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 26
          cache: true

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets

      # Publish the exact tarballs packed, attested, and signed above —
      # never a repack of the directories, which would be a different
      # artifact. With id-token: write and no auth token configured, pnpm
      # performs npm trusted publishing; --provenance emits the Sigstore
      # provenance attestation on npm.
      - name: Publish to npm (dry run)
        if: needs.build.outputs.publish != 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          pnpm publish "release-assets/knitli-marque-kit-core-$VERSION.tgz" --access public --provenance --no-git-checks --dry-run
          pnpm publish "release-assets/knitli-marque-kit-$VERSION.tgz" --access public --provenance --no-git-checks --dry-run

      - name: Publish to npm
        if: needs.build.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          pnpm publish "release-assets/knitli-marque-kit-core-$VERSION.tgz" --access public --provenance --no-git-checks
          pnpm publish "release-assets/knitli-marque-kit-$VERSION.tgz" --access public --provenance --no-git-checks

      - name: Install cosign
        if: needs.build.outputs.publish == 'true' && github.event_name == 'push'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless Sigstore signature over the checksums; verify with:
      #   cosign verify-blob --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Sign release checksums (Sigstore)
        if: needs.build.outputs.publish == 'true' && github.event_name == 'push'
        working-directory: release-assets
        run: |
          sha256sum ./*.tgz > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          ls -l

      - name: Create GitHub release
        if: needs.build.outputs.publish == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/*.tgz release-assets/SHA256SUMS release-assets/SHA256SUMS.sigstore.json \
            --verify-tag --generate-notes \
            --title "$TAG" \
            --notes "Packages: \`@knitli/marque-kit-core@$TAG\` and \`@knitli/marque-kit@$TAG\` (tag version without the \`v\`), published to npm with trusted publishing and Sigstore provenance. Verify the tarballs with \`gh attestation verify <file> --repo knitli/marque-kit\` or \`cosign verify-blob --bundle SHA256SUMS.sigstore.json SHA256SUMS\`."
