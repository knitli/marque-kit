name: Publish

# Versions, changelogs and publishes every package under packages/, each on
# its own semver line. release-please reads Conventional Commits on main and
# assigns each commit to the packages whose paths it touches
# (release-please-config.json); it keeps one release PR open that bumps each
# affected package.json and writes its CHANGELOG.md. Merging that PR tags each
# released package (<component>-v<version>, e.g. core-v0.3.0), creates its
# GitHub release with the changelog as notes, and runs the build and publish
# jobs below for exactly those packages.
#
# npm trusted publishing is bound to this file's name (publish.yml), this
# repo, and the `npm-publish` environment. Changing any of the three breaks
# publishing until the trusted publisher is updated on npmjs.com. Keep
# release-please in this file: a tag or release made with GITHUB_TOKEN does
# not trigger another workflow, so a separate release workflow could not
# start this one. See RELEASING.md.

on:
  push:
    branches: [main]
  # Dry run of every package: check, test, build, pack, attest. Publishes
  # nothing and creates no release.
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and tags
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # release commits, tags, GitHub releases
      pull-requests: write # the release PR
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  build:
    name: Check, test, build, pack
    needs: release-please
    if: ${{ !cancelled() && !failure() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.releases_created == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Sigstore keyless signing for the build attestation
      attestations: write
    outputs:
      releases: ${{ steps.pack.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 26
          cache: true

      - name: Format, lint, typecheck
        run: vp run check

      - name: Test
        run: vp run test

      - name: Build
        run: vp run build

      # pnpm pack, not npm pack: pnpm normalizes the workspace: dependency
      # to the real version in the packed manifest. These exact tarballs are
      # attested, published to npm, and attached to each package's release.
      # Each line of `releases` pairs a package's tag with its tarball.
      - name: Pack tarballs
        id: pack
        env:
          PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            paths="$(jq -r '.packages | keys[]' release-please-config.json)"
          else
            paths="$(jq -r '.[]' <<<"$PATHS_RELEASED")"
          fi
          mkdir -p release-assets
          : > releases.jsonl
          for path in $paths; do
            component="$(jq -r --arg p "$path" '.packages[$p].component' release-please-config.json)"
            version="$(jq -r .version "$path/package.json")"
            before="$(ls release-assets)"
            pnpm --filter "./$path" pack --pack-destination "$GITHUB_WORKSPACE/release-assets"
            tarball="$(comm -13 <(echo "$before") <(ls release-assets))"
            jq -nc --arg tag "$component-v$version" --arg tarball "$tarball" '{tag: $tag, tarball: $tarball}' >> releases.jsonl
          done
          echo "releases=$(jq -sc . releases.jsonl)" >> "$GITHUB_OUTPUT"
          cat releases.jsonl
          ls -l release-assets

      # Sigstore-backed GitHub attestation over the exact tarballs npm receives.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release-assets/*.tgz'

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm, sign, attach to releases
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Trusted publishing exchanges this job's OIDC token with npm; no
    # NPM_TOKEN secret exists or may be added. The environment's protection
    # rules (required reviewers) are the human gate on a real publish.
    environment: npm-publish
    permissions:
      contents: write # upload assets to the GitHub releases
      id-token: write # npm trusted publishing, npm provenance, Sigstore keyless signing
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 26
          cache: true

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      # Publish the exact tarballs packed, attested, and signed above —
      # never a repack of the directories, which would be a different
      # artifact. With id-token: write and no auth token configured, pnpm
      # performs npm trusted publishing; --provenance emits the Sigstore
      # provenance attestation on npm. A manual run is always a dry run.
      - name: Publish to npm
        run: |
          dry_run=""
          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && dry_run="--dry-run"
          for tarball in release-assets/*.tgz; do
            pnpm stage publish "$tarball" --access public --provenance --no-git-checks $dry_run
          done

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Keyless Sigstore signature over the checksums of every tarball in
      # this run; verify with:
      #   cosign verify-blob --bundle SHA256SUMS.sigstore.json \
      #     --certificate-identity "https://github.com/knitli/marque-kit/.github/workflows/publish.yml@refs/heads/main" \
      #     --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
      #     SHA256SUMS
      # Keyless flows require both flags; without them cosign refuses to verify.
      - name: Sign release checksums (Sigstore)
        if: github.event_name == 'push'
        working-directory: release-assets
        run: |
          sha256sum ./*.tgz > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          ls -l

      # release-please created each release with its changelog; attach the
      # tarball, the signed checksums, and how to verify them.
      - name: Attach assets to GitHub releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASES: ${{ needs.build.outputs.releases }}
        run: |
          note="Published to npm with trusted publishing and Sigstore provenance. Verify the tarball with \`gh attestation verify <file> --repo $GH_REPO\`, or the checksums with \`cosign verify-blob --bundle SHA256SUMS.sigstore.json --certificate-identity \"https://github.com/$GH_REPO/.github/workflows/publish.yml@refs/heads/main\" --certificate-oidc-issuer \"https://token.actions.githubusercontent.com\" SHA256SUMS\`."
          jq -c '.[]' <<<"$RELEASES" | while read -r release; do
            tag="$(jq -r .tag <<<"$release")"
            tarball="$(jq -r .tarball <<<"$release")"
            gh release upload "$tag" "release-assets/$tarball" release-assets/SHA256SUMS release-assets/SHA256SUMS.sigstore.json --clobber
            body="$(gh release view "$tag" --json body --jq .body)"
            gh release edit "$tag" --notes "$body"$'\n\n'"$note"
          done
