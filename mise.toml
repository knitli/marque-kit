[tools]
node = "26"
pnpm = "12.14"
viteplus = "latest"
python = "3.13"
hk = { version = "2.8.1", workflow = "release.yml" }
pkl = "0.32.2"
zizmor = "1.31.1"
yq = "4.54.1"
"npm:knip" = "6.42.1"
jactionlint = "2.3.0"

[tools.'pypi:reuse']
version = "latest"
uvx = true
extras = ["charset-normalizer"]
python = "3.13"

[tool_alias]
jactionlint = "actionlint"

[settings]
experimental = true
lockfile = true
lockfile_auto_prune = true
gpg_verify = true
pin = true
slsa = true

[settings.npm]
package_manager = "pnpm"

[settings.pypi]
uvx = true

[settings.skills]
auto_sync = true

[settings.task]
run_auto_install = true

[deps]
pnpm = { auto = true, sources = ["package.json", "pnpm-lock.yaml"], run = "pnpm i -y" }

[tasks]

[tasks.fix]
run = "vp check --fix"
tools.viteplus = "latest"

[tasks.check]
run = "vp check"
tools.viteplus = "latest"

[tasks.fmt]
run = "vp fmt --write"
tools.viteplus = "latest"

[tasks.pre-commit]
run = "hk run pre-commit"

[env]
HK_MISE = "1"
MISE_EXPERIMENTAL = "1"
MISE_YES = "1"
